<helmet>
  <style>
    @font-face { font-family: 'Clover Fields Serif'; src: url('./fonts/clover-fields-serif.otf') format('opentype'); font-display: swap; }
    @font-face { font-family: 'Minion Variable Concept'; src: url('./fonts/minion-variable-concept.otf') format('opentype'); font-display: swap; }
    @font-face { font-family: 'Gantari'; src: url('./fonts/gantari-variable.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Borna'; src: url('./fonts/borna-medium.otf') format('opentype'); font-weight: 500; font-display: swap; }
    html, body { margin: 0; padding: 0; background: #F8F8F7; color: #33260F; font-family: 'Borna', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B41E1E; text-decoration: none; }
    a:hover { color: #E37A58; }
    .gv-noscroll::-webkit-scrollbar { display: none; }
    @keyframes gvFooterLeaves { 0%,100% { transform: scale(1) rotate(0deg) translateY(0); filter: brightness(1); } 50% { transform: scale(1.05) rotate(-1.2deg) translateY(-1.5%); filter: brightness(1.06); } }
    @keyframes gvRise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gvBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes gvFadeOut { to { opacity: 0; visibility: hidden; } }
    @keyframes gvSway { 0%,100% { transform: translateX(0) skewX(0deg) scale(1); } 30% { transform: translateX(-6px) skewX(-0.7deg) scale(1.008); } 65% { transform: translateX(7px) skewX(0.8deg) scale(1.004); } }
    @keyframes gvGrow { 0% { clip-path: inset(100% 0 0 0); transform: scaleY(0.9); } 100% { clip-path: inset(0 0 0 0); transform: scaleY(1); } }
    @keyframes gvBreathe { 0%,100% { transform: scale(1); opacity: 0.82; } 50% { transform: scale(1.06); opacity: 1; } }
    [data-screen-label="category-bar"] { position: -webkit-sticky; position: sticky; top: 72px; }
    html, body, #dc-root, .sc-host { height: auto !important; min-height: 100%; }
    @media (max-width: 600px) {
      [data-m="sec-title"] { font-size: 26px !important; }
      [data-m="sec-sub"] { font-size: 10px !important; letter-spacing: 0.14em !important; }
      [data-m="sec-note"] { font-size: 12px !important; }
      [data-m="card-name"], [data-m="card-price"] { font-size: 13px !important; }
      [data-m="card-desc"] { font-size: 12.5px !important; }
      [data-m="group"] { font-size: 12px !important; padding: 6px 12px !important; }
      [data-m="hlang"] { font-size: 11px !important; }
      [data-m="hicon"], [data-m="hicon-img"] { height: 38px !important; }
      [data-m="hicon"] { position: static !important; transform: none !important; order: -1; }
      [data-m="gnav"] { position: static !important; transform: none !important; margin: 0 auto !important; }
      [data-m="foot-pad"] { padding: 44px 18px 14px !important; }
      [data-screen-label="footer"] [data-m="foot-pad"] div, [data-screen-label="footer"] a, [data-screen-label="footer"] button { font-size: 11px !important; }
      [data-m="tab"] { font-size: 12.5px !important; padding: 8px 14px !important; }
    }
    @media (prefers-reduced-motion: reduce) { .gv-sway, .gv-grow, .gv-breathe { animation: none !important; clip-path: none !important; } }
  </style>

</helmet>

<div data-screen-label="header" style="position:fixed;top:0;left:0;right:0;z-index:50;{{ headerBg }};transition:background-color .3s;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,48px);box-sizing:border-box">
  <canvas ref="{{ setHeaderCanvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-1;pointer-events:none"></canvas>
  
  <nav data-m="gnav" style="display:flex;gap:4px;padding:3px;border-radius:999px;border:1px solid {{ navBorder }};background:rgba(255,240,232,0.16);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(4px)">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <button data-m="group" onClick="{{ g.onClick }}" style="{{ g.style }}">{{ g.label }}</button>
    </sc-for>
  </nav>
  <a data-m="hicon" href="#top" onClick="{{ goTop }}" aria-label="Guava" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;height:58px">
    <img data-m="hicon-img" src="./assets/guava/logo-icon.svg" alt="Guava" style="height:58px;width:auto;display:block">
  </a>
  
  <div style="display:flex;align-items:center;gap:24px">
  
  <div style="display:flex;gap:14px">
    <sc-for list="{{ headerLangs }}" as="l" hint-placeholder-count="2">
      <button data-m="hlang" onClick="{{ l.onClick }}" style="{{ l.style }}">{{ l.label }}</button>
    </sc-for>
  </div>
  </div>
</div>

<div id="top" data-screen-label="menu-hero" style="position:relative;overflow:hidden;margin-top:0;height:calc(72px + clamp(240px,34vw,460px));background-color:#B41E1E">
  <video ref="{{ setVideoRef }}" src="./assets/guava/leaves.mp4" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" preload="none" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
  <canvas ref="{{ setCanvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
</div>

<div data-screen-label="category-bar" style="position:sticky;top:72px;z-index:40;background:#544024;border-top:1px solid rgba(48,42,15,0.4)">
  <div style="display:flex;align-items:center;gap:10px;max-width:1280px;margin:0 auto;padding:14px clamp(12px,4vw,48px);box-sizing:border-box">
    <button onClick="{{ tabsLeft }}" aria-label="Previous categories" style="flex-shrink:0;width:42px;height:42px;border-radius:50%;border:1px solid rgba(252,242,234,0.45);background:none;color:#FCF2EA;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
    <div ref="{{ setTabsRef }}" class="gv-noscroll" style="flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="8">
        <button data-m="tab" data-tab="{{ tab.key }}" onClick="{{ tab.onClick }}" style="{{ tab.style }}">{{ tab.label }}</button>
      </sc-for>
    </div>
    <button onClick="{{ tabsRight }}" aria-label="Next categories" style="flex-shrink:0;width:42px;height:42px;border-radius:50%;border:1px solid rgba(252,242,234,0.45);background:none;color:#FCF2EA;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">›</button>
  </div>
</div>

<div id="menu" data-screen-label="menu" style="max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 96px;box-sizing:border-box">
  <sc-if value="{{ groupEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="padding:96px 0;text-align:center;font-family:'Clover Fields Serif',serif;font-size:32px;color:#544024">{{ t.drinksSoon }}</div>
  </sc-if>
  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="2">
    <section id="{{ sec.anchor }}" data-cat="{{ sec.key }}" style="padding-top:48px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:28px;border-bottom:1px solid #33260F">
        <h2 data-m="sec-title" style="margin:0;font-family:'Clover Fields Serif',serif;font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1;color:#33260F"><sc-for list="{{ sec.titleParts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.text }}<sc-if value="{{ p.breve }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 10 5" aria-hidden="true" style="position:absolute;left:50%;top:-0.2em;width:0.42em;height:0.21em;transform:translateX(-50%);overflow:visible"><path d="M1 0.6 Q5 6 9 0.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></sc-if></span></sc-for></h2>
        <span data-m="sec-sub" style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#544024">{{ sec.subtitle }}</span>
      </div>
      <sc-if value="{{ sec.note }}" hint-placeholder-val="{{ false }}">
        <p data-m="sec-note" style="margin:-12px 0 28px;font-family:Gantari,sans-serif;font-size:14px;color:#7A6A55">{{ sec.note }}</p>
      </sc-if>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,max(240px,calc((100% - 48px) / 3))),1fr));gap:36px 24px">
        <sc-for list="{{ sec.items }}" as="item" hint-placeholder-count="4">
          <article style="display:flex;flex-direction:column;background:#FBE9DC;border-radius:14px;overflow:hidden">
            <sc-if value="{{ item.showImg }}" hint-placeholder-val="{{ true }}">
            <div style="aspect-ratio:4/3;background:#EDB38B;overflow:hidden">
              <sc-if value="{{ item.hasImg }}" hint-placeholder-val="{{ false }}">
                <img src="{{ item.img }}" alt="{{ item.name }}" loading="lazy" decoding="async" width="900" height="675" style="width:100%;height:100%;object-fit:cover;display:block">
              </sc-if>
            </div>
            </sc-if>
            <div style="display:flex;flex-direction:column;gap:8px;padding:16px 18px 20px;flex:1">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
                <h3 data-m="card-name" style="margin:0;font-family:'Borna',sans-serif;font-weight:500;font-size:15px;text-transform:uppercase;line-height:1.15;color:#33260F;text-wrap:pretty">{{ item.name }}</h3>

      setFootCvRef: el => { if (el) { this._fcv2 = el; this.startFootLeaves(); } },
      setLoaderCanvasRef: el => { this._lcv = el || null; this._lctx = null; },
      loaderOpacity: this.state.loaderFade ? 0 : 1,
      setLoaderBoxRef: el => { this._lbox = el; },
      setLoaderGlRef: el => { if (el) { this._lgc = el; this.startLoaderGl(); } },
      setLoaderVidRef: el => { if (el) { this._lvid = el; this.startLoaderGl(); } if (el && !el._gvBound) { el._gvBound = true; el.muted = true; el.addEventListener('ended', () => this.endLoader()); el.addEventListener('loadeddata', () => { if (this.state.loading && el.paused) { const p = el.play(); if (p && p.catch) p.catch(() => {}); } }); el.addEventListener('error', () => { /* Keep branded loader visible until the safety timeout. */ }); el.addEventListener('stalled', () => this.armStall()); el.addEventListener('waiting', () => this.armStall()); const p = el.play && el.play(); if (p && p.catch) p.catch(() => { /* Mobile autoplay can reject before playback starts; do not dismiss the intro. */ }); this.armStall(); } },
      setHeaderCanvasRef: el => { if (el) { this._hcv = el; this._hctx = null; } },
      setCanvasRef: el => { if (el) { this._cv = el; this.startLeaves(); } },
      growDelay: '0.2s',
      growDelayHeader: '1.7s',
      iconSrc: './assets/guava/logo-icon.svg',
      navBorder: 'rgba(180,30,30,0.5)',
      groupEmpty: menu.length === 0 && this.state.group !== 'food',
      groups: ['food', 'shisha', 'drinks'].map(g => {
        const on = g === this.state.group;
        return {
          label: t[g],
          onClick: () => this.setGroup(g),
          style: 'cursor:pointer;border:none;padding:6px 15px;border-radius:999px;font-family:Borna,sans-serif;font-size:13px;letter-spacing:0.04em;background:' + (on ? '#B41E1E' : 'transparent') + ';color:' + (on ? '#FFFFFF' : '#B41E1E') + ';transition:background .2s,color .2s'
        };
      }),
      setTabsRef: el => { this._tabs = el; },
      tabsLeft: () => {
        const b = this._tabs; if (!b) return;

        else b.scrollBy({ left: -b.clientWidth * 0.7, behavior: 'smooth' });
      },
      tabsRight: () => {
        const b = this._tabs; if (!b) return;
        if (b.scrollLeft + b.clientWidth >= b.scrollWidth - 2) { const m = this.state.menu; if (m.length) { b.scrollTo({ left: 0, behavior: 'smooth' }); this.jumpTo(m[0].key); } }
        else b.scrollBy({ left: b.clientWidth * 0.7, behavior: 'smooth' });
      },
      headerLangs: ['en', 'ro'].map(l => ({

        onClick: () => this.setLang(l),
        style: 'background:none;border:none;padding:0 0 3px;cursor:pointer;font-family:Borna,sans-serif;font-size:13px;letter-spacing:0.12em;color:#B41E1E;border-bottom:1px solid ' + (l === lang ? '#B41E1E' : 'transparent')
      })),
      langs: ['en', 'ro'].map(l => ({
        label: l.toUpperCase(),
        onClick: () => this.setLang(l),
        style: 'background:none;border:none;padding:0 0 3px;cursor:pointer;font-family:Borna,sans-serif;font-size:13px;letter-spacing:0.12em;color:#B41E1E;border-bottom:1px solid ' + (l === lang ? '#B41E1E' : 'transparent')
      })),
      tabs: menu.map(c => {
        const on = c.key === this.state.active;
        return {
          key: c.key,
          label: lang === 'ro' ? c.ro : c.en,
          onClick: () => this.jumpTo(c.key),
          style: 'flex-shrink:0;cursor:pointer;padding:11px 20px;border-radius:999px;font-family:Gantari,sans-serif;font-weight:400;font-size:15px;white-space:nowrap;border:1px solid ' + (on ? '#302A0F' : 'rgba(252,242,234,0.45)') + ';background:' + (on ? '#302A0F' : 'transparent') + ';color:' + (on ? '#FFFFFF' : '#FCF2EA') + ';transition:background .2s,color .2s,border-color .2s'
        };
      }),
      setEndRef: el => { this._end = el; },
      sections: menu.map((c, i) => ({ c, i })).map(({ c, i }) => ({

        subtitle: lang === 'ro' ? c.en : c.ro,
        note: (lang === 'ro' && c.noteRo) || c.note || '',
        items: c.items.map(it => ({
          name: it.name,
          desc: (lang === 'ro' && it.descRo) || it.desc || '',
          price: it.prices ? it.prices.map(p => p[0] + ' · ' + p[1] + ' ' + t.lei).join('\n') : (it.price != null ? (it.size ? it.size + ' · ' : '') + it.price + ' ' + t.lei : (it.size || '')),
          showImg: this.state.group === 'food',
          hasImg: this.state.group === 'food' && !NO_IMG.includes(it.name),
          img: './assets/guava/menu/' + slug(it.name) + '.webp'
        }))
      }))
